<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us | Acmetex Inc.</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- SEO -->
  <meta name="description" content="Contact Foretex Inc. for high-temperature textiles and welding blankets. Call 905-487-3428 or email sales@acmetex.com.">
  <meta name="keywords" content="high temperature textiles, industrial insulation, heat resistant materials, welding blankets, fiberglass cloth, silicone coated fabric, silica cloth, PTFE thread, Kevlar thread, Canada, Foretex Inc">
  <link rel="canonical" href="https://www.foretexinc.ca/Contact">
  <meta property="og:title" content="Contact Us | Acmetex Inc.">
  <meta property="og:description" content="Contact Foretex Inc. for high-temperature textiles and welding blankets. Call 905-487-3428 or email sales@acmetex.com.">
  <meta property="og:url" content="https://www.foretexinc.ca/Contact">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://www.foretexinc.ca/images/logo.jpg">
  <meta property="og:site_name" content="Foretex Inc.">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Contact Us | Acmetex Inc.">
  <meta name="twitter:description" content="Contact Foretex Inc. for high-temperature textiles and welding blankets. Call 905-487-3428 or email sales@acmetex.com.">
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

  <!--#include virtual="/header.html" -->

  <!-- Contact Section -->
  <section class="py-16 px-6 md:px-12 bg-gray-100">
    <div class="max-w-6xl mx-auto grid md:grid-cols-2 gap-12">

      <!-- Contact Info -->
      <div class="space-y-6">
        <h1 class="text-4xl font-bold text-gray-700">Contact Us</h1>

        <div class="bg-white rounded-2xl shadow p-6">
          <h2 class="text-xl font-semibold mb-2">Acmetex Inc.</h2>
          <p><strong>Address:</strong> 747 Appleby Line, Burlington ON, L7L 2Y6</p>
          <p><strong>Phone:</strong> <a href="tel:9054873428" class="text-gray-700 hover:underline">905-487-3428</a> / 
             <a href="tel:18886411238" class="text-gray-700 hover:underline">1-888-641-1238</a></p>
          <p><strong>Email:</strong> <a href="mailto:sales@acmetex.com" class="text-gray-700 hover:underline">sales@acmetex.com</a></p>
        </div>

        <div class="bg-white rounded-2xl shadow p-6">
          <h2 class="text-xl font-semibold mb-2">Warehouse Locations</h2>
          <ul class="list-disc list-inside">
            <li>Toronto</li>
            <li>Edmonton</li>
          </ul>
        </div>

        <div class="map rounded-2xl overflow-hidden shadow">
          <iframe 
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2886.399474699124!2d-79.791!3d43.373!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zNDPCsDIyJzIzLjAiTiA3OcKwNDcnMjcuNiJX!5e0!3m2!1sen!2sca!4v0000000000"
            width="100%" 
            height="300" 
            style="border:0;" 
            allowfullscreen="" 
            loading="lazy">
          </iframe>
        </div>
      </div>

      <!-- Contact Form -->
      <div class="bg-white rounded-2xl shadow p-8">
        <h2 class="text-2xl font-bold text-gray-700 mb-6">Request a Quote</h2>
        <form 
          action="http://localhost:8000/api/quote" 
          method="POST" 
          class="grid gap-4"
        >
          <input type="hidden" name="_captcha" value="false">
          <input type="hidden" name="_next" value="thank-you.html">

          <input type="text" name="fullName" placeholder="Full Name" class="p-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-red-500" required>
          <input type="email" name="email" placeholder="Email Address" class="p-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-red-500" required>
          <input type="text" name="company" placeholder="Company Name" class="p-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-red-500">
          <textarea name="requirements" placeholder="Your Requirements" class="p-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-red-500" rows="5"></textarea>
          <button type="submit" class="bg-gray-700 text-white font-bold py-3 px-6 rounded-2xl shadow-lg hover:bg-red-600 transition-colors">Submit Request</button>
        </form>
      </div>

    </div>
  </section>

  <!-- Footer -->
  <footer class="bg-gray-900 text-gray-300 py-8 text-center">
    <p>&copy; 2025 Acmetex Inc. All rights reserved.</p>
  </footer>

</body>
</html>
