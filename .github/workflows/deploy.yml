name: Deploy to IONOS

on:
  push:
    branches:
      - seo

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up SSH key
        env:
          REMOTE_HOST: ${{ secrets.IONOS_HOST }}
          SSH_KEY: ${{ secrets.IONOS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "${SSH_KEY}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${REMOTE_HOST}" >> ~/.ssh/known_hosts

      - name: Deploy via rsync
        env:
          REMOTE_PATH: ${{ secrets.IONOS_REMOTE_PATH }}
          REMOTE_USER: ${{ secrets.IONOS_USER }}
          REMOTE_HOST: ${{ secrets.IONOS_HOST }}
          SSH_PORT: ${{ secrets.IONOS_SSH_PORT }}
        run: |
          rsync -avz --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.gitignore' \
            --exclude='*.zip' \
            --exclude='template.txt' \
            --exclude='competitors.txt' \
            -e "ssh -i ~/.ssh/id_rsa -p ${SSH_PORT}" \
            ./ \
            "${REMOTE_USER}@${REMOTE_HOST}:${REMOTE_PATH}"
